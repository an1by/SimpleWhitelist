pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

rootProject.name = 'SimpleWhitelist'

include(
        'common',
        'bungeecord',
        'velocity',
        'bukkit',
        'sponge-legacy',
        'sponge',
        'fabric',
        'forge-legacy',
        'forge',
        'neoforge'
)
