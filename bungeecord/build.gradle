apply from: '../gradle-scripts/platform.gradle'

repositories {
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

processResources {
    inputs.property('mod_version', mod_version)
    filesMatching('bungee.yml') {
        expand 'mod_version': mod_version
    }
}

dependencies {
    compileOnly "net.md-5:bungeecord-api:${bungeecord_version}"

    implementation "org.yaml:snakeyaml:${snakeyaml_version}"
    shadow "org.yaml:snakeyaml:${snakeyaml_version}"

    implementation "net.kyori:adventure-text-minimessage:${adventure_minimessage_version}"
    shadow "net.kyori:adventure-text-minimessage:${adventure_minimessage_version}"

    implementation "net.kyori:adventure-platform-bungeecord:${adventure_platform_version}"
    shadow "net.kyori:adventure-platform-bungeecord:${adventure_platform_version}"

    implementation "com.mojang:brigadier:${mojang_brigadier}"
    shadow "com.mojang:brigadier:${mojang_brigadier}"
}

shadowJar {
    relocate 'net.kyori', 'net.aniby.simplewhitelist.libs.kyori'
    relocate 'com.mojang.brigadier', 'net.aniby.simplewhitelist.libs.brigadier'
    relocate 'org.yaml.snakeyaml', 'net.aniby.simplewhitelist.libs.snakeyaml'
}
