plugins {
    id 'com.gradleup.shadow' version "${shadow_version}" apply false
    id 'com.modrinth.minotaur' version "${minotaur_version}" apply false
    id 'io.papermc.hangar-publish-plugin' version "${hangar_publish_version}" apply false
}

apply from: "gradle-scripts/taskutils.gradle"

def platformModules = [
        'bungeecord',
        'velocity',
        'bukkit',
        'sponge-legacy',
        'sponge',
        'fabric',
        'forge-legacy',
        'forge',
        'neoforge'
]

tasks.register('publishModrinthAll') {
    group = 'simplewhitelist'
    description = 'Publishes all 9 universal platform JARs to Modrinth'
    dependsOn platformModules.collect { ":${it}:modrinth" }
}
