name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test all platforms
        run: ./gradlew build --no-daemon

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplewhitelist-jars
          path: |
            bungeecord/build/libs/simplewhitelist-bungeecord-*.jar
            velocity/build/libs/simplewhitelist-velocity-*.jar
            bukkit/build/libs/simplewhitelist-bukkit-*.jar
            sponge-legacy/build/libs/simplewhitelist-sponge-legacy-*.jar
            sponge/build/libs/simplewhitelist-sponge-*.jar
            fabric/build/libs/simplewhitelist-fabric-*.jar
            forge-legacy/build/libs/simplewhitelist-forge-legacy-*.jar
            forge/build/libs/simplewhitelist-forge-*.jar
            neoforge/build/libs/simplewhitelist-neoforge-*.jar
            !**/*-slim.jar
            !**/*-sources.jar
          if-no-files-found: error
