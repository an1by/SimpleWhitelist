name: SimpleWhitelist
version: '${mod_version}'
main: net.aniby.simplewhitelist.bukkit.BukkitWhitelistPlugin
description: Simple whitelist system for your server
authors: [An1by]
website: https://modrinth.com/plugin/simplewhitelist
api-version: '1.13'
folia-supported: true

commands:
  simplewhitelist:
    description: Manage SimpleWhitelist
    aliases: [swl, simplewl]
    usage: /<command> [add|remove|list|enable|disable|reload|help]

permissions:
  simplewhitelist.command.*:
    description: Grants access to all SimpleWhitelist subcommands
    default: op
    children:
      simplewhitelist.command: true
      simplewhitelist.command.add: true
      simplewhitelist.command.remove: true
      simplewhitelist.command.list: true
      simplewhitelist.command.enable: true
      simplewhitelist.command.disable: true
      simplewhitelist.command.reload: true
  simplewhitelist.command:
    description: Base permission for SimpleWhitelist
    default: op
  simplewhitelist.command.add:
    description: Add a player to the whitelist
    default: op
  simplewhitelist.command.remove:
    description: Remove a player from the whitelist
    default: op
  simplewhitelist.command.list:
    description: View whitelisted players
    default: op
  simplewhitelist.command.enable:
    description: Enable the whitelist
    default: op
  simplewhitelist.command.disable:
    description: Disable the whitelist
    default: op
  simplewhitelist.command.reload:
    description: Reload SimpleWhitelist configuration
    default: op
